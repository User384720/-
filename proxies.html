<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus &middot; Proxies</title>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://www.google.com">
</head>

<body class="secret-body" data-hub="proxies">

<div class="secret-shell">

  <!-- ================= Kopf ================= -->
  <header class="secret-header">
    <h1 class="secret-title">Nexus</h1>
    <p class="secret-sub">Open-Source-Proxies mit eigener Instanz</p>
  </header>

  <div class="secret-status">
    <span class="status-item"><span class="dot"></span><span class="value">Online</span></span>
    <span class="status-item"><span class="value" id="entry-count">0</span>&nbsp;Eintr&auml;ge</span>
    <span class="right" id="status-right"></span>
  </div>

  <!-- ================= Kategorien (Leiste oben) ================= -->
  <nav class="hub-nav" id="hub-nav" aria-label="Kategorien"></nav>

  <!-- ================= Einträge ================= -->
  <section class="secret-section">
    <div class="secret-section-head">
      <h2 id="hub-section-title">Proxies</h2>
      <span class="count" id="hub-count"></span>
    </div>
    <p class="hub-intro" id="hub-intro">Open-Source-Proxies für den Eigenbetrieb. Die Links führen zu den Projekten mit Anleitung.</p>
    <div class="secret-grid" id="hub-grid">
      <!-- Karten kommen aus den Einträgen in hub.js -->
    </div>
  </section>

  <div class="secret-note" id="hub-note">Die Projekte benötigen eine eigene Instanz (Server oder Service Worker) und werden nicht mitgehostet.</div>

  <footer class="secret-footer">
    Nexus &middot; privat &middot; kein Index
  </footer>

</div>

<!-- Panic-Button -->
<button type="button" class="panic-btn" id="panic" title="Sofort zu Google wechseln">
  Panik <kbd>ESC</kbd>
</button>

  <!-- Eigener Seitenteil, dann die gemeinsame Logik mit allen Daten -->
  <script src="proxies.js"></script>
  <script src="hub.js"></script>
</body>
</html>
